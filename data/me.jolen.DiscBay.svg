<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="0.55" stop-color="#ff6b8b"/>
      <stop offset="1" stop-color="#7a4cff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="hole">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="64" cy="70" r="9" fill="#000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- the island -->
  <rect x="30" y="20" width="68" height="14" rx="7" fill="#0c0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="38" cy="27" r="3.4" fill="url(#disc)"/>
  <rect x="45" y="25" width="26" height="4" rx="2" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="80" y="23.5" width="12" height="7" rx="3.5" fill="#ffffff"/>
  <!-- the disc -->
  <g mask="url(#hole)">
    <circle cx="64" cy="70" r="36" fill="url(#disc)"/>
    <path d="M64 70 L28 52 A36 36 0 0 1 40 40 Z" fill="url(#sheen)"/>
    <path d="M64 70 L100 88 A36 36 0 0 1 88 100 Z" fill="url(#sheen)"/>
    <circle cx="64" cy="70" r="15" fill="#ffffff" fill-opacity="0.32"/>
  </g>
  <circle cx="64" cy="70" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
</svg>
