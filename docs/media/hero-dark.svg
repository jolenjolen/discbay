<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"
     aria-label="A disc spins while a notification slides in: Night Drive, inserted, starting in 5">
  <defs>
    <radialGradient id="glow" cx="50%" cy="62%" r="55%">
      <stop offset="0" stop-color="#ff6a1f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.48" stop-color="#7a2a6b"/>
      <stop offset="0.72" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <mask id="ring">
      <circle cx="0" cy="0" r="190" fill="#fff"/>
      <circle cx="0" cy="0" r="28.5" fill="#000"/>
    </mask>
    <mask id="miniRing">
      <circle cx="0" cy="0" r="20" fill="#fff"/>
      <circle cx="0" cy="0" r="3.6" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <g id="art">
      <rect x="-190" y="-190" width="380" height="380" fill="url(#cover)"/>
      <circle cx="0" cy="19.0" r="79.8" fill="url(#sun)"/>
      <g fill="#1b1640" opacity="0.85">
        <rect x="-190" y="41.8" width="380" height="190"/>
      </g>
      <g stroke="#ff6a3d" stroke-width="3" opacity="0.7">
        <line x1="-190" y1="60.8" x2="190" y2="60.8"/>
        <line x1="-190" y1="87.4" x2="190" y2="87.4"/>
        <line x1="-190" y1="121.6" x2="190" y2="121.6"/>
        <line x1="0" y1="41.8" x2="-304.0" y2="190"/>
        <line x1="0" y1="41.8" x2="304.0" y2="190"/>
        <line x1="0" y1="41.8" x2="-104.5" y2="190"/>
        <line x1="0" y1="41.8" x2="104.5" y2="190"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="560" rx="16" fill="#000000"/>
  <ellipse cx="600" cy="360" rx="460" ry="300" fill="url(#glow)"/>

  <!-- the disc -->
  <g transform="translate(600 330)">
    <g filter="url(#shadow)">
      <g mask="url(#ring)">
        <g>
          <use href="#art"/>
          <!-- rainbow sheen sweeping round, the tell of a spinning disc -->
          <g opacity="0.32" style="mix-blend-mode:screen">
            <path d="M0 0 L190 -40 A190 190 0 0 1 190 40 Z" fill="#9be7ff"/>
            <path d="M0 0 L-190 40 A190 190 0 0 1 -190 -40 Z" fill="#ffb3f0"/>
          </g>
          <circle r="62.7" fill="#fff" opacity="0.26"/>
          <circle r="45.6" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
        </g>
      </g>
      <circle r="189.5" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1"/>
    </g>
  </g>

  <!-- the island, swooshing down from the top -->
  <g transform="translate(0 -150)">
    <animateTransform attributeName="transform" type="translate"
      values="0 -150; 0 14; 0 0; 0 0; 0 -150" keyTimes="0; 0.06; 0.09; 0.93; 1"
      calcMode="spline" keySplines="0.2 0.9 0.3 1; 0.4 0 0.6 1; 0 0 1 1; 0.6 0 0.9 0.4"
      dur="8s" begin="0.4s" repeatCount="indefinite"/>
    <g transform="translate(395 34)" filter="url(#shadow)">
      <rect width="410" height="66" rx="33" fill="#0c0c10" fill-opacity="0.96"/>
      <rect width="410" height="66" rx="33" fill="none" stroke="#fff" stroke-opacity="0.08"/>
      <g transform="translate(37 33)">
        <g mask="url(#miniRing)">
          <g transform="scale(0.1053)"><use href="#art"/></g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
        </g>
        <circle r="23" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2.4"/>
        <circle r="23" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"
                transform="rotate(-90)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
          <animate attributeName="stroke-dashoffset" values="0;0;100;100" keyTimes="0;0.1000;0.7250;1" dur="8s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="72" y="29" font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Cantarell, sans-serif" font-size="16" font-weight="700" fill="#fff">Night Drive</text>
      <text x="72" y="48" font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Cantarell, sans-serif" font-size="12.5" fill="#fff" fill-opacity="0.62" visibility="visible">Inserted · starting in 5<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;0.0000;0.1250" calcMode="discrete" dur="8s" begin="0.4s" repeatCount="indefinite"/></text><text x="72" y="48" font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Cantarell, sans-serif" font-size="12.5" fill="#fff" fill-opacity="0.62" visibility="hidden">Inserted · starting in 4<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;0.2250;0.3500" calcMode="discrete" dur="8s" begin="0.4s" repeatCount="indefinite"/></text><text x="72" y="48" font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Cantarell, sans-serif" font-size="12.5" fill="#fff" fill-opacity="0.62" visibility="hidden">Inserted · starting in 3<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;0.3500;0.4750" calcMode="discrete" dur="8s" begin="0.4s" repeatCount="indefinite"/></text><text x="72" y="48" font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Cantarell, sans-serif" font-size="12.5" fill="#fff" fill-opacity="0.62" visibility="hidden">Inserted · starting in 2<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;0.4750;0.6000" calcMode="discrete" dur="8s" begin="0.4s" repeatCount="indefinite"/></text><text x="72" y="48" font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Cantarell, sans-serif" font-size="12.5" fill="#fff" fill-opacity="0.62" visibility="hidden">Inserted · starting in 1<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;0.6000;0.7250" calcMode="discrete" dur="8s" begin="0.4s" repeatCount="indefinite"/></text>
      <g font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Cantarell, sans-serif" font-size="13" font-weight="600">
        <rect x="242" y="17" width="74" height="32" rx="16" fill="#fff" fill-opacity="0.13"/>
        <text x="279" y="38" text-anchor="middle" fill="#fff">Cancel</text>
        <rect x="324" y="17" width="72" height="32" rx="16" fill="#fff" fill-opacity="0.94"/>
        <text x="360" y="38" text-anchor="middle" fill="#0c0c10">Start</text>
      </g>
    </g>
  </g>
</svg>
